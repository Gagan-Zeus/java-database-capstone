<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
    
    <link rel="icon" href="../assets/images/logo/logo.png" />
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />
    
    <!-- Utility & Components -->
    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script type="module" src="../js/components/modals.js"></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <main class="main-content">
                <!-- Search & Filters -->
                <div class="controls-section">
                    <input type="text" id="searchBar" class="searchBar input-field" placeholder="Search Bar for custom output" />
                    
                    <div class="filter-wrapper">
                        <select class="filter-select select-dropdown" id="filterTime">
                            <option value="">Sort by time</option>
                            <option value="AM">Morning (AM)</option>
                            <option value="PM">Afternoon/Evening (PM)</option>
                        </select>
                        <select class="filter-select select-dropdown" id="filterSpecialty">
                            <option value="">Filter by specialty</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Orthopedist">Orthopedist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Dermatologist">Dermatologist</option>
                        </select>
                    </div>
                </div>
                
                <!-- Dynamic Content Container for Doctor Cards -->
                <div id="content"></div>
            </main>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Reusable Modal Markup -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page Logic -->
    <script type="module" src="../js/patientDashboard.js" defer></script>
</body>
</html>
