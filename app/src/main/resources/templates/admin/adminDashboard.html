<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    
    <!-- Utility Scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    
    <!-- Layout Component Scripts -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <main class="main-content">
                <!-- Filters & Search -->
                <div class="controls-section">
                    <input type="text" id="searchBar" class="input-field" placeholder="search by doctor name" />
                    
                    <div class="filter-dropdowns">
                        <select id="sortByTime" class="select-dropdown">
                            <option value="">Sort by time</option>
                            <option value="asc">Earliest First</option>
                            <option value="desc">Latest First</option>
                        </select>
                        
                        <select id="filterBySpecialty" class="select-dropdown">
                            <option value="">Filter by specialty</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Orthopedist">Orthopedist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Dermatologist">Dermatologist</option>
                        </select>
                    </div>
                </div>
                
                <!-- Dynamic Content Container -->
                <div id="content"></div>
            </main>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal for Adding Doctors -->
    <div id="modal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <!-- Service Scripts -->
    <script type="module" src="../js/services/adminDashboard.js" defer></script>
    <script type="module" src="../js/components/doctorCard.js" defer></script>
</body>
</html>
