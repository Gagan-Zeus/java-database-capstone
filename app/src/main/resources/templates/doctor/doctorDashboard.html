<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DoctorDashboard</title>
    
    <link rel="icon" th:href="@{/assets/images/logo/logo.png}" />
    
    <!-- CSS Links -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    
    <!-- Utility Scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    
    <!-- Components -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script type="module" src="../js/components/patientRows.js" defer></script>
    
    <!-- Services & Logic -->
    <script type="module" src="../js/services/patientServices.js" defer></script>
    <script type="module" src="../js/doctorDashboard.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <main class="main-content">
                <!-- Filters & Search -->
                <div class="controls-section">
                    <input type="text" id="searchBar" class="input-field search-input" placeholder="Search by patient name" />
                    
                    <div class="filter-actions">
                        <button id="todayBtn" class="action-btn">Today's Appointments</button>
                        <input type="date" id="dateFilter" class="input-field date-input" />
                    </div>
                </div>
                
                <!-- Patient Records Table -->
                <div class="table-container">
                    <table id="patientTable">
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Prescription</th>
                            </tr>
                        </thead>
                        <tbody id="patientTableBody">
                            <!-- Populated dynamically by JS -->
                        </tbody>
                    </table>
                </div>
            </main>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
